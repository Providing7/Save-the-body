<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Salve o Corpo — CardioRunner</title>
    <meta name="theme-color" content="#1a0406" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CardioRunner" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0203;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        height: 100dvh;
      }

      #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game-container canvas {
        display: block;
      }

      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        background: #0d0203;
        color: #f2c7c7;
        font-family: monospace;
        text-align: center;
      }

      #rotate-hint .icon {
        width: 64px;
        height: 104px;
        border: 3px solid #d94f4f;
        border-radius: 12px;
        animation: rotate-phone 2s ease-in-out infinite;
      }

      #rotate-hint p {
        margin: 0;
        font-size: 16px;
      }

      #rotate-hint small {
        color: #d9a5a5;
        font-size: 12px;
      }

      @keyframes rotate-phone {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>

    <div id="rotate-hint">
      <div class="icon" aria-hidden="true"></div>
      <p>Gire o celular para jogar</p>
      <small>No iPhone: Compartilhar → Adicionar à Tela de Início</small>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
